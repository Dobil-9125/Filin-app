# Supabase 무료 요금제는 7일 동안 데이터베이스 활동이 적으면 프로젝트를 일시정지해요.
# 이 작업은 매일 한 번 두 프로젝트의 데이터베이스에 아주 가벼운 읽기 요청(행 1개)을 보내서
# "활동이 있다"고 기록되게 해요. 데이터는 읽기만 하고 바꾸지 않아요.
#
# - 앱 서버(eiojasxqcgfhypzvgdzp): 로그인·리뷰·수의사 AI. 공개용 키가 이미 앱 코드(index.html)에 있어서 그대로 써요.
# - 톡톡 봇 서버 "FILIN APP"(jafmexguhgvlokbnidof): 공개용 키를 저장소 Secrets 의
#   SUPABASE_TALK_KEY 에 넣어야 해요. 없으면 이 프로젝트는 건너뛰고 경고만 남겨요.
#
# 참고: GitHub 는 저장소에 60일 동안 아무 변경이 없으면 예약 작업을 멈춰요. 그때는 Actions 화면에서 다시 켜 주세요.
name: Supabase 잠들지 않게 하기
on:
  schedule:
    - cron: "17 18 * * *" # 매일 한국 시간 새벽 3시 17분
  workflow_dispatch: # Actions 화면에서 "Run workflow" 로 바로 돌려 볼 수 있어요
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: https://eiojasxqcgfhypzvgdzp.supabase.co
      APP_KEY: sb_publishable_IzblR7JHCcBhHfRniZG0Vw_Q3wl3wEJ # index.html 에 있는 공개용 키
      TALK_URL: https://jafmexguhgvlokbnidof.supabase.co
      TALK_KEY: ${{ secrets.SUPABASE_TALK_KEY }}
    steps:
      - name: 앱 서버 (리뷰 표 1행 읽기)
        run: |
          code=$(curl -sS -m 30 --retry 3 --retry-delay 10 -o out.txt -w '%{http_code}' \
            -H "apikey: $APP_KEY" "$APP_URL/rest/v1/product_reviews?select=id&limit=1")
          echo "응답 코드: $code"; head -c 300 out.txt; echo
          test "$code" = 200
      - name: 톡톡 봇 서버 "FILIN APP" (대화 기록 표 1행 읽기)
        run: |
          if [ -z "$TALK_KEY" ]; then
            echo "::warning::SUPABASE_TALK_KEY 가 없어서 FILIN APP 프로젝트는 건너뛰었어요."
            exit 0
          fi
          code=$(curl -sS -m 30 --retry 3 --retry-delay 10 -o out.txt -w '%{http_code}' \
            -H "apikey: $TALK_KEY" "$TALK_URL/rest/v1/talk_turns?select=id&limit=1")
          echo "응답 코드: $code"; head -c 300 out.txt; echo
          test "$code" = 200
