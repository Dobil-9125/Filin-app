# 안드로이드 시험용 설치 파일(APK)을 만들어요.
# - PR: 만들어지는지만 확인하고, 실행 결과 화면(Artifacts)에 APK를 올려요.
# - main에 합쳐지면: "안드로이드 시험판" 릴리스에 최신 APK를 올려서 링크 하나로 받을 수 있게 해요.
name: 안드로이드 설치 파일
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - name: 설치 파일 만들기
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk filin-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: filin-test-apk
          path: filin-test.apk
      - name: 시험판 릴리스에 올리기
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --title "안드로이드 시험판" --notes "main에 합쳐질 때마다 최신 시험용 설치 파일로 바뀌어요. 안드로이드 휴대폰에서 filin-test.apk 를 받아 설치해요."
          gh release upload android-test filin-test.apk --clobber
