<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png?v=4">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="필린">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FILIN 앱 시제품</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width app column, white top bar, bottom tabs. Bright light look taken from the FILIN logo: navy, sunny yellow, heart red, with pastel tiles */
:root{
  --bg:#fffcf7; --surface:#ffffff; --ink:#1b2847; --muted:#636d86; --line:#ede6da;
  --slate:#17336b; --slate-ink:#ffffff; --amber:#ffc23d; --amber-soft:#fff3cf; --amber-ink:#6a4900;
  --coral:#ec5446; --sky:#e7f0ff; --peach:#ffeadf; --mint:#e2f5ea; --lilac:#efe9ff;
  --good:#2f7a4f; --warn:#b4531a;
  --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --r:16px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--slate);border-bottom:1px solid var(--line);padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--body);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--slate)}
.logo i{color:var(--coral);font-style:normal;font-size:12px;vertical-align:top;margin-left:1px}
.logo small{font-family:var(--body);font-weight:400;font-size:11px;letter-spacing:.02em;color:var(--muted);margin-left:6px}
.pet-chip{background:var(--amber-soft);color:var(--amber-ink);border:0;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}

main{flex:1;padding-block:18px 110px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.3}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.hello{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(170deg,var(--sky) 0%,#f4f8ff 55%,var(--amber-soft) 100%);padding:22px 18px 0;display:flex;flex-direction:column;gap:12px}
.hello h1{font-size:27px;line-height:1.32;color:var(--slate)}
.hello h1 em{font-style:normal;color:var(--coral)}
.hello p{color:var(--muted);font-size:14px;max-width:30ch}
.hello .duo{display:flex;justify-content:center;align-items:flex-end;gap:0;margin-top:2px;position:relative}
.hello .duo::before{content:"";position:absolute;left:-18px;right:-18px;bottom:0;height:34px;background:#cfe8c4;border-radius:50% 50% 0 0/100% 100% 0 0}
.hello .duo img{position:relative;height:170px;width:auto;max-width:48%;object-fit:contain}
.hello .duo img+img{margin-left:-14px}
@media (prefers-reduced-motion:no-preference){.hello .duo img:first-child{animation:wave 2.6s ease-in-out infinite;transform-origin:50% 100%}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:var(--r);padding:14px;display:grid;grid-template-columns:38px 1fr;gap:4px 10px;align-items:center;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.tile .ic{grid-row:span 2;width:38px;height:38px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--slate)}
.tile .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-weight:700;font-size:14.5px}
.tile span{font-size:12px;color:var(--muted);line-height:1.35}
.t-sky{background:var(--sky)}.t-peach{background:var(--peach)}.t-mint{background:var(--mint)}.t-amber{background:var(--amber-soft)}
.worry{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:var(--lilac);border-radius:var(--r);padding:12px 14px 0 8px;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.worry img{align-self:end;width:96px;height:auto}
.worry div{padding-bottom:12px;display:flex;flex-direction:column;gap:4px}
.worry b{font-size:16px;color:var(--slate);font-weight:700}
.worry span{font-size:13px;color:var(--muted)}
.worry u{font-size:13px;color:var(--slate);text-underline-offset:3px}
.brands{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.bcard{scroll-snap-align:start;position:relative;border:0;padding:0;border-radius:var(--r);overflow:hidden;cursor:pointer;font:inherit;text-align:left;aspect-ratio:4/3;max-width:100%}
.bcard img{width:100%;height:100%;object-fit:cover;display:block}
.bcard div{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(10,20,40,.78));color:#fff;display:flex;flex-direction:column}
.bcard b{font-size:17px}
.bcard span{font-size:12px;opacity:.92}
.start{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.start img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.start .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;font-size:14px}
.steps li i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.trust{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:var(--mint);border-radius:var(--r);padding:14px}
.trust img{border-radius:12px;aspect-ratio:1;object-fit:cover}
.trust ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.brand-banner{border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/9;max-width:100%}
.brand-banner img{width:100%;height:100%;object-fit:cover;display:block}
.brand-banner div{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(10,20,40,.78));color:#fff;font-size:13px}
.brand-banner b{display:block;font-size:17px}
.foot{display:flex;flex-direction:column;align-items:center;gap:6px}
.foot img{width:84px;height:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--amber);color:var(--ink);box-shadow:0 3px 0 #e2a21c}
.btn.dark{background:var(--slate);color:var(--slate-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.pcard:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.qcard b{font-weight:500}
.qcard span{font-size:13px;color:var(--muted)}

.benefit{background:var(--amber-soft);color:var(--amber-ink);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.benefit ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px;font-size:14px}

.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;color:var(--slate);font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.hscroll>*{scroll-snap-align:start}

.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.pcard .ph{background:#fff;border-radius:10px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.pcard .ph img{width:88%;height:88%;object-fit:contain}
.pcard .brand{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.pcard .name{font-size:14px;font-weight:500;line-height:1.35}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge.hot{background:var(--amber-soft);color:var(--amber-ink);border-color:transparent}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--slate);color:var(--slate-ink);border-color:var(--slate)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.q{display:flex;flex-direction:column;gap:8px}
.q>b{font-weight:500;font-size:14px}

.rec{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.rec .ph{background:#fff;border-radius:10px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.rec .ph img{width:90%;height:90%;object-fit:contain}
.rec ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.rank{font-size:12px;color:var(--amber-ink);background:var(--amber-soft);border-radius:6px;padding:1px 7px;align-self:flex-start}
.caution{font-size:13px;color:var(--warn)}

.result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-family:var(--display);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{background:none;border:0;font:inherit;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--slate)}

.sheet-bg{position:fixed;inset:0;background:rgba(10,16,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:460px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .ph{background:#fff;border-radius:14px;display:grid;place-items:center;padding:10px}
.sheet .ph img{max-height:220px;object-fit:contain}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.spec dt{color:var(--muted)}
dl.spec dd{margin:0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.proto{font-size:11.5px;text-align:center;color:var(--muted)}
.seri{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.seri img{border-radius:50%;aspect-ratio:1;object-fit:cover}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
.petbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.mini{display:flex;align-items:center;gap:10px;min-width:0}
.mini img{width:40px;height:40px;object-fit:contain;background:var(--sky);border-radius:50%;padding:3px}
.ptr{position:fixed;left:50%;top:0;z-index:30;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(23,51,107,.18);display:grid;place-items:center;color:var(--slate);font-size:20px;transform:translateY(-60px);opacity:0;pointer-events:none}
.ptr.ready{background:var(--amber)}
.ptr.spin span{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.swipe{position:relative;border-radius:var(--r);overflow:hidden}
.swipe .petcard{position:relative;z-index:1;width:100%;touch-action:pan-y}
.swdel{position:absolute;right:0;top:0;bottom:0;width:96px;border:0;background:var(--coral);color:#fff;font:inherit;font-weight:700;font-size:14px;white-space:pre-line;line-height:1.3;cursor:pointer}
.phonebox{display:flex;flex-direction:column;gap:6px;background:var(--amber-soft);border-radius:12px;padding:12px;margin:10px 0}
.phone-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.phone-row input{min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.petcard .go{font-size:22px;line-height:1;color:var(--muted);vertical-align:-2px;margin-left:2px}
img.photo{object-fit:cover!important;padding:0!important;border-radius:50%}
.photo-pick{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.photo-pick img{width:84px;height:84px;border-radius:50%;object-fit:contain;background:var(--amber-soft)}
.photo-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn.sm{padding:8px 14px;font-size:14px;cursor:pointer}
.mini b{display:block;font-size:14px}
.mini span{font-size:12px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg .av{width:42px;height:42px;object-fit:contain;border-radius:50%;background:var(--lilac);padding:2px;flex:none}
.msg.oli .av{background:var(--amber-soft)}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:14.5px;line-height:1.5}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--slate);color:var(--slate-ink);border-color:var(--slate);border-radius:16px 16px 4px 16px}
.edit-a{background:none;border:0;color:inherit;opacity:.75;text-decoration:underline;font:inherit;font-size:12px;cursor:pointer;margin-left:4px;padding:0}
.answer{display:flex;flex-wrap:wrap;gap:6px;padding-left:50px}
.row.end{justify-content:flex-end}
.petlist{display:flex;flex-direction:column;gap:8px}
.petcard{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.petcard[aria-pressed="true"]{border-color:var(--slate);background:var(--sky)}
.petcard img{width:52px;height:52px;object-fit:contain;border-radius:50%;background:var(--amber-soft)}
.petcard b{font-size:15px}
.petcard .sub{font-size:12.5px;color:var(--muted)}
.petcard .on{font-size:11px;color:var(--slate);font-weight:700}
.bday{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;background:var(--peach);border-radius:var(--r);padding:12px 14px;font-size:14px}
.bday img{width:56px;height:56px;object-fit:contain}
textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:64px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.check input{width:20px;height:20px}
.buy{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:var(--r);padding:12px}
.opt{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;font-size:15px}
.opt input{width:18px;height:18px;margin:0;accent-color:var(--slate)}
.opt:has(input:checked){border-color:var(--slate)}
.save{margin-left:auto;font-size:12px;font-weight:700;color:var(--coral);background:var(--peach);border-radius:6px;padding:2px 7px}
.hint{font-size:13px;color:var(--ink);background:var(--amber-soft);border-radius:10px;padding:9px 11px}
.ship{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.ship .top{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.ship .top img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:10px}
.ship .next{display:flex;justify-content:space-between;align-items:baseline;background:var(--mint);border-radius:10px;padding:9px 12px}
.ship .next b{font-size:15px}
.ship .next span{font-size:12.5px;color:var(--good);font-weight:700}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acts .btn{padding:9px 6px;font-size:13px}
.btn.warn{background:transparent;color:var(--warn);border:1px solid var(--line)}
.shipbanner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--mint);border:0;border-radius:var(--r);padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.shipbanner b{display:block}
.shipbanner span{font-size:12.5px;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.t-lilac{background:var(--lilac)}.t-rose{background:#ffe4ea}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--muted)}
.pill.s0{background:var(--sky);color:var(--slate)}.pill.s1{background:var(--amber-soft);color:var(--amber-ink)}.pill.s2{background:var(--peach);color:var(--warn)}.pill.s3{background:var(--mint);color:var(--good)}
.track{list-style:none;margin:0;padding:0 0 0 6px;display:flex;flex-direction:column}

const ymd = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseYmd = s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };

function ageMonths(p){ if(!p.birth) return 24; const [y,m]=p.birth.split("-").map(Number); const n=new Date(); return Math.max(0,(n.getFullYear()-y)*12+(n.getMonth()+1-m)); }
function ageText(p){ const m=ageMonths(p); return m<12?`${m}개월`:`${Math.floor(m/12)}살`; }
function stageOf(p){ const a=ageMonths(p)/12; if(p.sp==="dog") return a<1?"puppy":a>=7?"senior":"adult"; return a<1?"kitten":a>=10?"senior":"adult"; }
function sizeOf(p){ return (LARGE_BREEDS.includes(p.breed)||p.weight>=25)?"large":p.weight<10?"small":"medium"; }

function recommend(pt){
  const st=stageOf(pt), sz=sizeOf(pt), al=pt.allergies||[], pr=pt.prefs||[];
  return P.filter(p=>p.sp===pt.sp).map(p=>{
    if(al.includes(p.prot) || (al.includes("grain") && !p.gf)) return null;
    let s=0; const why=[]; let caution=null;
    if(p.st.includes(st)){s+=4; why.push(`${stageName(st,pt.sp)} 단계에 맞는 레시피`);}
    else if(st!=="adult"){s-=6;}
    const hit=al.filter(a=>p.also && p.also[a]);
    if(hit.length){s-=1; caution=`주 단백질은 ${p.pl}이지만 ${hit.map(a=>`${allergenName(a)}(${p.also[a]})`).join(", ")}도 들어 있어요. 엄격히 피해야 하면 확인이 필요해요.`;}
    else if(al.includes("chicken")){s+=3; why.push(`닭고기 없이 ${p.pl} 단백질`);}
    if((pr.includes("gf")||al.includes("grain")) && p.gf){s+=2; why.push("곡물을 뺀 그레인프리");}
    if(pr.includes("simple") && p.ltd){s+=3; why.push("동물성 단백질이 하나라 원재료표가 짧아요");}
    if(pr.includes("picky") && p.tags.includes("picky")){s+=2; why.push("향이 뚜렷해 입 짧은 아이들이 많이 찾는 레시피");}
    if(pr.includes("novel") && p.tags.includes("novel")){s+=3; why.push(`닭·소와 다른 새로운 단백질 (${p.pl})`);}
    if(pr.includes("fish") && p.prot==="fish"){s+=2; why.push("생선 단백질");}
    if(pt.active==="high" && p.tags.includes("active")){s+=3; why.push("활동량 많은 아이용");}
    if(sz==="large" && p.large){s+=3; why.push("대형견용 레시피");}
    if(sz==="small" && p.small){s+=2; why.push("소형견용 작은 알갱이");}
    if(p.hot){s+=1.5; why.push("필린에서 많이 찾는 제품");}
    return {p,s,why,caution};
  }).filter(r=>r && r.s>0).sort((a,b)=>b.s-a.s).slice(0,3);
}

function feeding(pt, kcalPerKg){
  const w=Math.max(0.5,+pt.weight||1); const st=stageOf(pt);
  const rer = 70*Math.pow(w,0.75);
  let f;
  if(pt.sp==="dog"){ f = st==="puppy"?2.5 : st==="senior"?1.4 : pt.active==="high"?2.0 : pt.neutered?1.6:1.8; if(pt.active==="low"&&st!=="puppy") f-=0.2; }
  else { f = st==="kitten"?2.5 : st==="senior"?1.1 : pt.neutered?1.2:1.4; if(pt.active==="high"&&st!=="kitten") f+=0.2; }
  const kcal = rer*f; const grams = kcal/(kcalPerKg/1000);
  return {kcal:Math.round(kcal), grams:Math.round(grams)};
}
const DEFAULT_KCAL = 3600;
const sizesOf = p=> p.sizes || [2,5,10];
function bagDays(pt,p,size){ return Math.floor(size*1000/feeding(pt,p.kcal||DEFAULT_KCAL).grams); }
function suggestWeeks(pt,p,size){ return Math.max(1,Math.min(12,Math.floor(bagDays(pt,p,size)/7))); }

let chat = null;
function startChat(){ const pt=cur(); chat={pet:pt.id, step:0, prefs:[...(pt.prefs||[])], allergies:[...(pt.allergies||[])], active:pt.active||"normal"}; }
function bubble(who, html){
  const av = who==="me" ? "" : `<img class="av" src="${who==="seri"?"img/seri-hi.png":"img/oli-hi.png"}" alt="${who==="seri"?"세리":"올리"}">`;

}
function answerText(q,val,pt){
  const opts=q.opts(pt), name=v=>(opts.find(o=>o[0]===v)||[v,v])[1];
  return q.multi ? (val.length?val.map(name).join(", "):q.none) : name(val);
}
function vFind(){
  const pt=cur();
  if(!chat || chat.pet!==pt.id) startChat();
  let h = `<div class="stack"><span class="eyebrow">세리가 묻고 올리가 추천해요</span><h1>${esc(josa(pt.name,"이",""))} 밥, 같이 골라 볼까요?</h1></div>
    <div class="petbar">${petMini(pt)}<button class="link" type="button" data-go="pet">다른 아이</button></div>
    <div class="chat">${bubble("seri",`안녕하세요, 세리예요! ${esc(josa(pt.name,"이",""))} 프로필로 시작할게요. 질문은 세 개뿐이에요.`)}`;
  for(let i=0;i<QUESTIONS.length && i<=chat.step;i++){
    const q=QUESTIONS[i];
    h += bubble("seri", esc(q.q(pt)));
    if(i<chat.step){
      h += bubble("me", `${esc(answerText(q,chat[q.key],pt))}<button class="edit-a" type="button" data-redo="${i}">✎ 바꾸기</button>`);
    } else {
      h += chatNav();
      h += `<div class="answer">${q.opts(pt).map(([v,l])=>`<button class="chip" type="button" data-ans="${v}" aria-pressed="${q.multi?chat[q.key].includes(v):chat[q.key]===v}">${l}</button>`).join("")}</div>`;
      if(q.multi) h += `<div class="row end"><button class="btn ghost" type="button" data-none>${q.none}</button><button class="btn primary" type="button" data-next>다음</button></div>`;
    }
  }
  if(chat.step<QUESTIONS.length) return h+`</div>`;
  const recs = recommend({...pt, prefs:chat.prefs, allergies:chat.allergies, active:chat.active});
  h += bubble("oli", recs.length ? `올리예요! ${esc(josa(pt.name,"이에게","에게"))} 맞는 사료 ${recs.length}가지를 골랐어요. 눌러서 자세히 보세요.` : `조건에 딱 맞는 사료를 못 찾았어요. 답을 하나 바꿔 볼까요?`) + `</div>`;
  h += chatNav();
  h += `<section class="stack" id="recEnd">${recs.map(recCard).join("")}</section>`;
  if(recs.length) h += `<button class="btn dark block" type="button" data-autoship="${recs[0].p.id}">1순위 사료 정기배송으로 받기 (7% 할인)</button>`;
  h += `<p class="note">답한 내용은 ${esc(josa(pt.name,"이",""))} 프로필에 저장했어요. 사료 전환은 7~10일에 걸쳐 천천히, 알러지나 건강 고민은 수의사 선생님과 먼저 상담해 주세요.</p>
    <button class="btn ghost block" type="button" data-restart>처음부터 다시</button>`;
  return h;
}
function chatNav(){
  const n=QUESTIONS.length, done=chat.step>=n;
  return `<div class="chatnav">

function loadPhoto(file){
  const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{
    const n=320, c=document.createElement("canvas"), side=Math.min(im.naturalWidth,im.naturalHeight);
    c.width=c.height=n;
    c.getContext("2d").drawImage(im,(im.naturalWidth-side)/2,(im.naturalHeight-side)/2,side,side,0,0,n,n);
    URL.revokeObjectURL(url);
    draft.photo=c.toDataURL("image/jpeg",0.82); render(false);
  };
  im.onerror=()=>{ URL.revokeObjectURL(url); toast("이 사진은 열 수 없어요. 다른 사진을 골라 주세요."); };
  im.src=url;
}

// 아이 카드를 왼쪽으로 밀면 뒤에 있는 삭제 버튼이 보여요.
let swipeArm=null;
(()=>{
  const OPEN=96; let card=null, x0=0, y0=0, dx=0, base=0, horiz=null;
  const setX=(c,x,anim)=>{ c.style.transition=anim?"transform .2s":"none"; c.style.transform=x?`translateX(${x}px)`:""; c.dataset.open=x?"1":""; };
  const closeAll=except=>document.querySelectorAll('.petcard[data-open="1"]').forEach(c=>{ if(c!==except) setX(c,0,true); });
  addEventListener("touchstart",e=>{
    card=e.target.closest(".petcard"); if(!card || e.target.closest("[data-swdel]")){ card=null; return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; horiz=null; base=card.dataset.open?-OPEN:0;
  },{passive:true});
  addEventListener("touchmove",e=>{
    if(!card) return;
    const mx=e.touches[0].clientX-x0, my=e.touches[0].clientY-y0;
    if(horiz===null && (Math.abs(mx)>8||Math.abs(my)>8)) horiz=Math.abs(mx)>Math.abs(my);
    if(!horiz) return;
    dx=mx; setX(card,Math.max(-OPEN-20,Math.min(0,base+dx)),false); card.dataset.open="1";
  },{passive:true});
  addEventListener("touchend",()=>{
    if(!card) return;
    if(horiz){ const open=base+dx < -OPEN/2; closeAll(card); setX(card,open?-OPEN:0,true); swipeArm=null; card.dataset.swiped="1"; setTimeout(()=>{ if(card) delete card.dataset.swiped; },350); }
    card=null;
  });
  // 밀어 둔 카드는 한 번 누르면 닫히기만 해요.
  document.addEventListener("click",e=>{
    const c=e.target.closest(".petcard");
    if(c && (c.dataset.swiped || c.dataset.open)){ e.stopImmediatePropagation(); e.preventDefault(); if(!c.dataset.swiped) setX(c,0,true); return; }
    if(!e.target.closest("[data-swdel]")) closeAll();
  },true);
})();

async function saveReview(pid){

  if(!sb){ (reviews[pid]=reviews[pid]||[]).unshift({stars:draftReview.stars,text,date:ymd(today()),pet:cur().name}); store.set("reviews",reviews); draftReview={stars:5,text:""}; toast("후기를 남겼어요. 고마워요!"); openProduct(pid); return; }

  draftReview.busy=true; openProduct(pid);
  const nick=(user.user_metadata&&user.user_metadata.nickname)||"보호자", pt=cur();

function collectState(){ return {pets, cur:curId, samples, autoship, orders, logs, consults, reviews, questions}; }
function applyState(d){

  curId = d.cur && pets.some(p=>p.id===d.cur) ? d.cur : pets[0].id;

}
function queueSync(){
  if(!sb || !user || loadingAccount) return;
  syncMsg="저장 중…"; showSync();
  clearTimeout(syncTimer); syncTimer=setTimeout(pushState, 800);
}
async function pushState(){
  if(!sb || !user) return false;
  const {error} = await sb.from("user_data").upsert({user_id:user.id, data:collectState(), updated_at:new Date().toISOString()});
  const t=new Date();
  syncMsg = error ? "저장하지 못했어요. 인터넷 연결을 확인해 주세요." : `계정에 저장됨 · ${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")}`;

}

let syncing=false;
async function pullState(manual){
  if(!sb || !user || loadingAccount || syncing) return;
  if(syncMsg==="저장 중…" || (!manual && ["edit","find"].includes(current()))) return;
  syncing=true;
  const {data,error} = await sb.from("user_data").select("data").eq("user_id",user.id).maybeSingle();
  syncing=false;
  if(error){ if(manual) toast("불러오지 못했어요. 인터넷 연결을 확인해 주세요."); return; }
  if(data && data.data && JSON.stringify(data.data)!==JSON.stringify(collectState())){
    applyState(data.data); render(false); toast("다른 기기에서 바꾼 내용을 불러왔어요.");

// 맨 위에서 화면을 아래로 당겼다 놓으면 새로고침해요 (새 버전·계정 정보도 같이 받아요).
(()=>{
  const el=document.getElementById("ptr"), arrow=el.firstElementChild, NEED=80;
  let y0=null, dist=0;
  const reset=()=>{ el.style.transition="transform .2s, opacity .2s"; el.style.transform="translateY(-60px)"; el.style.opacity=0; el.classList.remove("ready"); y0=null; dist=0; };
  addEventListener("touchstart",e=>{
    y0 = (scrollY<=0 && e.touches.length===1 && !$("#sheetRoot").children.length && current()!=="edit") ? e.touches[0].clientY : null; dist=0;
  },{passive:true});
  addEventListener("touchmove",e=>{
    if(y0===null) return;
    dist=Math.max(0,e.touches[0].clientY-y0);
    if(scrollY>0){ y0=null; return reset(); }
    const d=Math.min(dist*0.5,90);
    el.style.transition="none"; el.style.opacity=Math.min(1,d/40); el.style.transform=`translateY(${d+20}px)`;
    arrow.style.transform=`rotate(${dist*2}deg)`;
    el.classList.toggle("ready",dist*0.5>=NEED*0.5 && dist>=NEED);
  },{passive:true});
  addEventListener("touchend",()=>{
    if(y0===null) return;
    if(dist>=NEED){ el.classList.add("spin"); el.style.transition="transform .2s"; el.style.transform="translateY(60px)"; (syncMsg==="저장 중…" ? (clearTimeout(syncTimer), pushState()) : Promise.resolve()).finally(()=>setTimeout(()=>location.reload(),250)); }
    else reset();
  });
})();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") pullState(false); });
function showSync(){ const el=document.getElementById("syncMsg"); if(el) el.textContent=syncMsg; }
async function onSignedIn(u){
  user=u; loadingAccount=true; renderChip();
  const {data,error} = await sb.from("user_data").select("data").eq("user_id",u.id).maybeSingle();
  loadingAccount=false;
  if(error){ toast("계정 정보를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요."); syncMsg="불러오기 실패"; render(false); return; }
  if(data && data.data && Object.keys(data.data).length){
    // 로그인 전에 이 기기에서 새로 등록한 아이·정기배송은 계정 정보에 더해서 잃어버리지 않게 해요.
    const local=collectState(), extra=(a,b)=>(a||[]).filter(x=>!x.example && !(b||[]).some(y=>y.id===x.id));
    const addPets=extra(local.pets,data.data.pets), addShip=extra(local.autoship,data.data.autoship);
    applyState(data.data);
    if(addPets.length || addShip.length){
      if(addPets.length && pets.every(p=>p.example)) pets=[];
      pets=pets.concat(addPets); autoship=autoship.concat(addShip);
      if(!pets.length) pets=local.pets;
      rawSet("pets",pets); rawSet("autoship",autoship); await pushState();
      toast(`계정 정보를 불러오고, 이 기기에서 등록한 ${addPets.map(p=>p.name).join(", ")||"정기배송"}도 계정에 더했어요.`);
    } else toast("계정에 저장된 정보를 불러왔어요.");
    syncMsg="계정 정보를 불러왔어요";
  }
  else { await pushState(); toast("이 휴대폰에 있던 정보를 계정에 저장했어요."); }
  if(current()==="account") go("pet"); else render(false);
}

        <p class="small muted" style="margin-top:-6px">네이버 스토어에서 주문하면 이 번호로 주문·배송이 앱에 연결돼요. 출시 때는 문자 인증을 거쳐요.</p>`:""}
      ${m==="signup"?`<label class="f">닉네임 (선택)<input id="a-nick" maxlength="12" autocomplete="nickname" placeholder="예: 올리 보호자"></label>`:""}
      ${m!=="reset"?`<label class="f">${m==="recovery"?"새 비밀번호":"비밀번호"}<input id="a-pw" type="password" minlength="6" autocomplete="${m==="login"?"current-password":"new-password"}" placeholder="6자 이상" required></label>`:""}
      ${m==="signup"||m==="recovery"?`<label class="f">비밀번호 확인<input id="a-pw2" type="password" autocomplete="new-password" required></label>`:""}
      ${m==="signup"?`<div class="consent">
          <label class="check"><input id="c-all" type="checkbox"> <b>모두 동의해요</b></label>
          <label class="check"><input id="c-age" type="checkbox" class="c-one"> [필수] 만 14세 이상이에요</label>
          <label class="check"><input id="c-pi" type="checkbox" class="c-one"> [필수] 개인정보 수집·이용에 동의해요</label>
          <p class="small muted pi">수집 항목: 이메일, 휴대폰 번호, 닉네임, 반려동물 정보(이름·생일·체중·알러지 등), 건강 기록, 주문·정기배송 내역<br>이용 목적: 회원 관리, 네이버 스토어 주문을 앱 주문·배송에 연결, 맞춤 추천, 정기배송, 상담<br>보유 기간: 탈퇴할 때까지 (시제품 문구예요. 출시 전에 법무 검토가 필요해요)</p>
          <label class="check"><input id="c-ad" type="checkbox" class="c-one"> [선택] 혜택·이벤트 알림을 받을게요</label>
        </div>`:""}
      ${acct.msg?`<p class="caution" role="alert">${esc(acct.msg)}</p>`:""}
      ${acct.ok?`<p class="hint" role="status">${esc(acct.ok)}</p>`:""}
      <button class="btn primary block" type="submit" ${acct.busy?"disabled":""}>${acct.busy?"잠시만요…":{login:"로그인",signup:"가입하기",reset:"재설정 메일 받기",recovery:"비밀번호 바꾸기"}[m]}</button>
      ${m==="login"?`<button class="link" type="button" data-amode="reset">비밀번호를 잊었어요</button>`:""}
      ${m==="reset"?`<button class="link" type="button" data-amode="login">로그인으로 돌아가기</button>`:""}
    </form>
    <button class="btn ghost block" type="button" data-go="home">로그인 없이 둘러보기</button>
    <p class="proto">로그인하지 않으면 정보는 이 휴대폰에만 저장돼요.</p>`;
}
// 휴대폰 번호는 숫자만 저장해요 (네이버 주문의 주문자 번호와 맞춰 보기 위해).
const phoneDigits = v=> String(v||"").replace(/\D/g,"");
const validPhone = d=> /^01[016789]\d{7,8}$/.test(d);
const phoneText = d=> d ? d.replace(/^(\d{3})(\d{3,4})(\d{4})$/,"$1-$2-$3") : "";
async function savePhone(){
  const d=phoneDigits(($("#acc-phone")||{}).value);
  if(!validPhone(d)){ toast("휴대폰 번호를 다시 확인해 주세요."); return; }
  const {data,error}=await sb.auth.updateUser({data:{phone:d, phone_verified:false}});
  if(error){ toast("저장하지 못했어요. 인터넷 연결을 확인해 주세요."); return; }
  user=data.user; acct.editPhone=false; toast("휴대폰 번호를 저장했어요."); render(false);
}
async function submitAuth(){
  const m=acct.mode, val=id=>{ const el=document.getElementById(id); return el?el.value:""; };
  const email=val("a-email").trim(), pw=val("a-pw"), pw2=val("a-pw2");
  acct.email=email; acct.msg=""; acct.ok="";
  if(m!=="recovery" && !/^\S+@\S+\.\S+$/.test(email)){ acct.msg="이메일 주소를 다시 확인해 주세요."; return render(false); }
  if((m==="login"||m==="signup"||m==="recovery") && pw.length<6){ acct.msg="비밀번호는 6자 이상으로 정해 주세요."; return render(false); }
  if((m==="signup"||m==="recovery") && pw!==pw2){ acct.msg="비밀번호 확인이 달라요. 한 번 더 확인해 주세요."; return render(false); }
  if(m==="signup" && !(document.getElementById("c-age").checked && document.getElementById("c-pi").checked)){ acct.msg="필수 항목에 동의해 주세요."; return render(false); }
  const phone = phoneDigits(val("a-phone"));
  if(m==="signup" && !validPhone(phone)){ acct.msg="휴대폰 번호를 다시 확인해 주세요. (예: 010-1234-5678)"; return render(false); }
  const marketing = m==="signup" && document.getElementById("c-ad").checked, nick = val("a-nick").trim();
  acct.busy=true; render(false);
  let res;
  if(m==="login") res = await sb.auth.signInWithPassword({email, password:pw});
  else if(m==="signup") res = await sb.auth.signUp({email, password:pw, options:{data:{nickname:nick, marketing, phone, phone_verified:false}, emailRedirectTo:appUrl()}});
  else if(m==="reset") res = await sb.auth.resetPasswordForEmail(email, {redirectTo:appUrl()});
  else res = await sb.auth.updateUser({password:pw});
  acct.busy=false;
  if(res.error){ acct.msg=authMsg(res.error); return render(false); }
  if(m==="signup" && !res.data.session){ acct.mode="login"; acct.ok=`${email}로 인증 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.`; return render(false); }
  if(m==="reset"){ acct.ok="비밀번호 재설정 메일을 보냈어요. 메일의 링크를 눌러 주세요."; return render(false); }
  if(m==="recovery"){ acct.mode="login"; toast("비밀번호를 바꿨어요."); return go("pet"); }
  toast(m==="signup"?"가입을 환영해요!":"로그인했어요.");
}
async function logout(){
  await pushState();
  await sb.auth.signOut();
  ["pets","cur","samples","autoship","orders","logs","consults","reviews","questions","pet"].forEach(k=>{ try{localStorage.removeItem("filin:"+k)}catch(e){} });
  location.hash="home"; location.reload();
}
async function wipeAccount(){
  const {error} = await sb.from("user_data").delete().eq("user_id", user.id);
  if(error){ toast("지우지 못했어요. 인터넷 연결을 확인해 주세요."); return; }
  await sb.auth.signOut();
  ["pets","cur","samples","autoship","orders","logs","consults","reviews","questions","pet"].forEach(k=>{ try{localStorage.removeItem("filin:"+k)}catch(e){} });
  location.hash="home"; location.reload();
}

/* ---------- 라우팅 ---------- */
const VIEWS={home:vHome,find:vFind,shop:vShop,ship:vShip,pet:vPet,edit:vEdit,health:vHealth,vet:vVet,account:vAccount};
const TAB_OF={edit:"pet",health:"pet",vet:"pet",account:"pet"};
function current(){ const h=location.hash.slice(1); if(h==="feed") return "ship"; return VIEWS[h]?h:"home"; }
function render(top=true){
  const v=current();
  $("#main").innerHTML = `<div class="view stack" style="gap:22px">${VIEWS[v]()}</div>`;
  const tab=TAB_OF[v]||v;
  document.querySelectorAll(".tab").forEach(t=>{ if(t.dataset.go===tab) t.setAttribute("aria-current","page"); else t.removeAttribute("aria-current"); });
  renderChip();
}
function go(v){ if(location.hash.slice(1)===v){render(); window.scrollTo(0,0);} else location.hash=v; }
window.addEventListener("hashchange",()=>{closeSheet();render();window.scrollTo(0,0);});

document.addEventListener("click",e=>{
  if(e.target.id==="sheetBg"){closeSheet();return;}
  const t=e.target.closest("button"); if(!t) return;
  const d=t.dataset;
  if(d.go){ closeSheet(); go(d.go); }
  else if(d.open){ openProduct(d.open,{reset:true}); }
  else if("close" in d){ closeSheet(); }
  else if(d.autoship){ openProduct(d.autoship,{reset:true,mode:"auto",size:d.size}); }
  else if(d.subscribe){ subscribe(d.subscribe); }
  // 추천 대화
  else if(d.ans!==undefined){ const q=QUESTIONS[chat.step]; if(q.multi){ const s=new Set(chat[q.key]); s.has(d.ans)?s.delete(d.ans):s.add(d.ans); chat[q.key]=[...s]; t.setAttribute("aria-pressed",s.has(d.ans)); } else { chat[q.key]=d.ans; chatAdvance(); } }
  else if("next" in d){ chatAdvance(); }
  else if("none" in d){ chat[QUESTIONS[chat.step].key]=[]; chatAdvance(); }
  else if(d.redo!==undefined){ chat.step=+d.redo; render(false); }
  else if("restart" in d){ startChat(); chat.step=0; render(false); toast("처음 질문부터 다시 시작해요."); }
  else if("back" in d){ chat.step=Math.max(0,chat.step-1); render(false); requestAnimationFrame(()=>{ const t=document.querySelector(".chat .answer"); if(t) t.scrollIntoView({block:"center",behavior:"smooth"}); }); }
  // 제품
  else if(d.fsp){ shopFilter.sp=d.fsp; render(); }
  else if(d.fb){ shopFilter.b=d.fb; render(); }
  else if(d.brand){ shopFilter={sp:"all",b:d.brand}; go("shop"); }
  // 정기배송 관리
  else if(d.skip){ const a=autoship.find(x=>x.id===d.skip); a.next=ymd(addDays(parseYmd(a.next),a.weeks*7)); saveShip(); toast(`이번 배송을 건너뛰었어요. 다음 배송은 ${fmt(parseYmd(a.next))}이에요.`); render(false); }
  else if(d.now){ const a=autoship.find(x=>x.id===d.now); a.next=ymd(addDays(today(),2)); saveShip(); toast(`${fmt(parseYmd(a.next))}에 도착하도록 바로 보낼게요.`); render(false); }
  else if(d.cancel){ if(cancelArm===d.cancel){ autoship=autoship.filter(x=>x.id!==d.cancel); cancelArm=null; saveShip(); toast("정기배송을 해지했어요."); } else { cancelArm=d.cancel; } render(false); }
  // 내 아이
  else if(d.pick){ if(curId!==d.pick){ curId=d.pick; chat=null; todayLog=null; savePets(); } startEdit(d.pick); }
  else if("addpet" in d){ startEdit(null); }
  else if(d.edit){ startEdit(d.edit); }
  else if(d.esp){ if(draft.sp!==d.esp){ draft.sp=d.esp; draft.breed=""; } render(false); }
  else if(d.eal){ const s=new Set(draft.allergies); s.has(d.eal)?s.delete(d.eal):s.add(d.eal); draft.allergies=[...s]; t.setAttribute("aria-pressed",s.has(d.eal)); }
  else if("save" in d){ saveDraft(); }
  else if("delphoto" in d){ delete draft.photo; render(false); }
  else if("delpet" in d){ if(delArm){ deletePet(draft.id); go("pet"); } else { delArm=true; render(false); } }
  else if(d.swdel){ if(swipeArm===d.swdel){ swipeArm=null; deletePet(d.swdel); render(false); } else { swipeArm=d.swdel; t.textContent="한 번 더\n누르면 삭제"; } }
  // 샘플
  else if(d.sample){ toggleSample(d.sample); render(false); }
  else if(d.sampleAdd){ const p=byId[d.sampleAdd]; if(p.sp!==cur().sp){toast(`${spName(cur().sp)}용 샘플만 담을 수 있어요.`);return;} if(!samples.includes(p.id)) toggleSample(p.id); closeSheet(); if(current()==="pet")render(false); }
  else if(d.order){ placeOrder(d.order); }
  else if(d.tab){ buy.tab=d.tab; openProduct(buy.id); }
  else if(d.track){ trackOpen = trackOpen===d.track?null:d.track; render(false); }
  else if(d.reorder){ const o=orders.find(x=>x.id===d.reorder); openProduct(o.prodId,{reset:true,size:o.size}); }
  else if(d.review){ openProduct(d.review,{reset:true,tab:"review"}); }
  else if(d.star){ draftReview.stars=+d.star; openProduct(buy.id); }
  else if(d.savereview){ saveReview(d.savereview); }
  else if(d.delreview){ deleteReview(+d.delreview); }
  else if(d.askq){ if(!draftQ.trim()){ toast("질문을 적어 주세요."); return; } (questions[d.askq]=questions[d.askq]||[]).unshift({text:draftQ.trim(),date:ymd(today())}); store.set("questions",questions); draftQ=""; toast("질문을 남겼어요. 답변이 오면 알려 드릴게요. (시제품)"); openProduct(buy.id); }
  else if(d.chk){ todayLog[d.chk]=d.val; render(false); }
  else if("savelog" in d){ const pt=cur(); const e={...todayLog}; delete e.pet; (logs[pt.id]=logs[pt.id]||{})[ymd(today())]=e; saveLogs(); toast(level(e)==="bad"?"저장했어요. 살펴봐야 할 신호가 있어요.":"오늘 기록을 저장했어요."); render(false); }
  else if(d.article){ openArticle(d.article); }
  else if(d.vhow){ vetForm.how=d.vhow; render(false); }
  else if(d.vtopic){ vetForm.topic=d.vtopic; render(false); }
  else if(d.vwhen){ vetForm.when=d.vwhen; render(false); }
  else if("sendvet" in d){ consults.unshift({id:"c"+Date.now(),petId:cur().id,how:vetForm.how,topic:vetForm.topic,when:vetForm.when,text:vetForm.text.trim(),attach:vetForm.attach,date:ymd(today())}); store.set("consults",consults); vetForm={how:"chat",topic:null,when:"soon",text:"",attach:true}; toast("상담을 신청했어요. 수의사 선생님이 확인하면 알려 드려요. (시제품)"); render(false); }
  else if(t.id==="sendSample"){ toast(`${samples.length}가지 샘플 신청을 받았어요. (시제품이라 실제로 접수되진 않아요)`); }
  else if(t.id==="petChip"){ go("pet"); }
  else if(d.amode){ acct.mode=d.amode; acct.msg=""; acct.ok=""; const el=document.getElementById("a-email"); if(el) acct.email=el.value.trim(); render(false); }
  else if("logout" in d){ logout(); }
  else if("savephone" in d){ savePhone(); }
  else if("editphone" in d){ acct.editPhone=true; render(false); }
  else if("pullnow" in d){ pullState(true); }
  else if("syncnow" in d){ pushState().then(ok=>toast(ok?"계정에 저장했어요.":"저장하지 못했어요.")); }
  else if("wipe" in d){ if(acct.delArm) wipeAccount(); else { acct.delArm=true; render(false); } }
});
function toggleSample(id){
  const i=samples.indexOf(id);
  if(i>-1) samples.splice(i,1);
  else if(samples.length>=3){ toast("샘플은 3가지까지 고를 수 있어요."); return; }
  else { samples.push(id); toast(`${BRANDS[byId[id].b].name} ${byId[id].n} 샘플을 담았어요.`); }
  store.set("samples",samples);
}
document.addEventListener("input",e=>{
  const id=e.target.id, v=e.target.value;
  if(id==="a-phone"||id==="acc-phone"){ const d=phoneDigits(v).slice(0,11); e.target.value=d.length>3?d.slice(0,3)+"-"+(d.length>7?d.slice(3,d.length-4)+"-"+d.slice(-4):d.slice(3)):d; }
  if(id==="e-name") draft.name=v;
  if(id==="e-breed") draft.breed=v.trim();
  if(id==="e-weight"){ const n=parseFloat(v); if(n>0) draft.weight=n; }
  if(id==="e-note") draft.note=v;
  if(id==="r-text") draftReview.text=v;
  if(id==="q-text") draftQ=v;
  if(id==="h-memo") todayLog.memo=v;
  if(id==="v-text"){ vetForm.text=v; const b=document.querySelector("[data-sendvet]"); if(b) b.disabled=!(vetForm.topic&&v.trim()); }
  if(id==="fd-kcal"){ const n=parseFloat(v); if(n>=2500&&n<=5000){feedSel.kcal=n; const pos=e.target.selectionStart; render(false); const el=$("#fd-kcal"); el.focus(); try{el.setSelectionRange(pos,pos)}catch(_){} } }
});
document.addEventListener("change",e=>{
  const id=e.target.id, v=e.target.value;
  if(id==="e-birth") draft.birth=v;
  if(id==="e-photo" && e.target.files[0]) loadPhoto(e.target.files[0]);
  if(id==="e-active") draft.active=v;
  if(id==="e-neutered") draft.neutered=e.target.checked;
  if(id==="v-attach") vetForm.attach=e.target.checked;
  if(id==="fd-prod"){ feedSel.id=v; feedSel.size=null; render(false); }
  if(id==="fd-size"){ feedSel.size=parseFloat(v); render(false); }
  if(e.target.name==="buy"){ buy.mode=v; openProduct(buy.id); }
  if(id==="b-size"){ buy.size=parseFloat(v); buy.weeks=null; openProduct(buy.id); }
  if(id==="b-weeks"){ buy.weeks=parseInt(v,10); openProduct(buy.id); }
  if(e.target.dataset.weeks){ const a=autoship.find(x=>x.id===e.target.dataset.weeks); a.weeks=parseInt(v,10); saveShip(); toast(`${a.weeks}주마다 배송으로 바꿨어요.`); }
});
document.addEventListener("submit",e=>{ if(e.target.id==="authForm"){ e.preventDefault(); submitAuth(); } });
document.addEventListener("change",e=>{
  if(e.target.id==="c-all") document.querySelectorAll(".c-one").forEach(c=>c.checked=e.target.checked);
  else if(e.target.classList.contains("c-one")){ const all=[...document.querySelectorAll(".c-one")].every(c=>c.checked); const a=document.getElementById("c-all"); if(a) a.checked=all; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
render();

// 휴대폰 홈 화면에 앱으로 설치할 수 있게 해 주는 파일(sw.js)을 켜요.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
