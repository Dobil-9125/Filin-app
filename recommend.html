<meta property="og:title" content="FILIN 맞춤 사료 추천">
<meta property="og:description" content="세리가 묻고 올리가 골라요. 질문 몇 개로 우리 아이에게 맞는 사료를 찾아 드려요.">

<style>
/* 앱(index.html)과 같은 색·글꼴. 넓은 화면에서는 가운데 한 열로 보여요 */
:root{
  --bg:#fffcf7; --surface:#ffffff; --ink:#1b2847; --muted:#636d86; --line:#ede6da;
  --slate:#17336b; --slate-ink:#ffffff; --amber:#ffc23d; --amber-soft:#fff3cf; --amber-ink:#6a4900;
  --coral:#ec5446; --sky:#e7f0ff; --peach:#ffeadf; --mint:#e2f5ea; --lilac:#efe9ff;
  --good:#2f7a4f; --warn:#b4531a;
  --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --r:16px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
img{max-width:100%}
[hidden]{display:none!important}
.page{max-width:620px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:620px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--slate);text-decoration:none}
.logo i{color:var(--coral);font-style:normal;font-size:12px;vertical-align:top;margin-left:1px}
.logo small{font-weight:400;font-size:12px;letter-spacing:.02em;color:var(--muted);margin-left:8px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.3;color:var(--slate)}
h1 em{font-style:normal;color:var(--coral)}
h2{font-size:21px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
main{display:flex;flex-direction:column;gap:22px;padding-top:20px}

.hero{border-radius:22px;overflow:hidden;background:linear-gradient(170deg,var(--sky) 0%,#f4f8ff 55%,var(--amber-soft) 100%);padding:24px 20px 0;display:flex;flex-direction:column;gap:12px}
.hero p{color:var(--muted);font-size:14.5px;max-width:34ch}
.duo{display:flex;justify-content:center;align-items:flex-end;position:relative;margin-top:4px}
.duo::before{content:"";position:absolute;left:-20px;right:-20px;bottom:0;height:34px;background:#cfe8c4;border-radius:50% 50% 0 0/100% 100% 0 0}
.duo img{position:relative;height:160px;width:auto;max-width:46%;object-fit:contain}
.duo img+img{margin-left:-14px}
@media (prefers-reduced-motion:no-preference){.duo img:first-child{animation:wave 2.6s ease-in-out infinite;transform-origin:50% 100%}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--amber);color:var(--ink);box-shadow:0 3px 0 #e2a21c}
.btn.dark{background:var(--slate);color:var(--slate-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:focus-visible,.chip:focus-visible,.navbtn:focus-visible,.rec:focus-visible,.link:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.link{background:none;border:0;color:var(--slate);font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

.chips,.answer{display:flex;gap:6px;flex-wrap:wrap}
.answer{padding-left:50px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--slate);color:var(--slate-ink);border-color:var(--slate)}
.multi{display:inline-block;font-size:11.5px;font-weight:500;color:var(--amber-ink);background:var(--amber-soft);border-radius:6px;padding:0 6px;margin-left:2px;white-space:nowrap}
.chip small{display:block;font-size:11.5px;opacity:.75;line-height:1.3}

.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg .av{width:42px;height:42px;object-fit:contain;border-radius:50%;background:var(--lilac);padding:2px;flex:none}
.msg.oli .av{background:var(--amber-soft)}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:14.5px;line-height:1.5}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--slate);color:var(--slate-ink);border-color:var(--slate);border-radius:16px 16px 4px 16px}
.edit-a{background:rgba(255,255,255,.18);color:inherit;border:0;font:inherit;font-size:12px;border-radius:999px;padding:2px 8px;margin-left:8px;cursor:pointer}
.chatnav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.navbtn{border:0;background:var(--bg);color:var(--slate);font:inherit;font-size:13px;font-weight:500;border-radius:9px;padding:8px 10px;cursor:pointer}
.navbtn:disabled{color:var(--line);cursor:default}
.prog{font-size:12.5px;color:var(--muted);font-weight:500}

.rec{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.rec .ph{background:#fff;border-radius:10px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.rec .ph img{width:90%;height:90%;object-fit:contain}
.rec ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.rec .more{font-size:12.5px;color:var(--slate);text-decoration:underline;text-underline-offset:3px}
.rank{font-size:12px;color:var(--amber-ink);background:var(--amber-soft);border-radius:6px;padding:1px 7px;align-self:flex-start}
.caution{font-size:13px;color:var(--warn);background:#fff1e8;border-radius:8px;padding:6px 9px}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.summary b{font-weight:500}
.cta{background:var(--mint);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}

.sheet-bg{position:fixed;inset:0;background:rgba(10,16,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:84%}}
.sheet .ph{background:#fff;border-radius:14px;display:grid;place-items:center;padding:10px;border:1px solid var(--line)}
.sheet .ph img{max-height:220px;object-fit:contain}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.spec dt{color:var(--muted)}
dl.spec dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.foot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.foot img{width:84px;height:auto}
@media (max-width:420px){.logo small{display:none}.rec{grid-template-columns:76px minmax(0,1fr)}}
</style>
</head>

function recommend(pt){
  const st=stageOf(pt), sz=sizeOf(pt), al=pt.allergies||[], pr=pt.prefs||[];
  return P.filter(p=>p.sp===pt.sp).map(p=>{
    if(al.includes(p.prot) || (al.includes("grain") && !p.gf)) return null;
    let s=0; const why=[]; let caution=null;
    if(p.st.includes(st)){s+=4; why.push(`${stageName(st,pt.sp)} 단계에 맞는 레시피`);}
    else if(st!=="adult"){s-=6;}
    const hit=al.filter(a=>p.also && p.also[a]);
    if(hit.length){s-=1; caution=`주 단백질은 ${p.pl}이지만 ${hit.map(a=>`${allergenName(a)}(${p.also[a]})`).join(", ")}도 들어 있어요. 엄격히 피해야 하면 확인이 필요해요.`;}
    else if(al.includes("chicken")){s+=3; why.push(`닭고기 없이 ${p.pl} 단백질`);}
    if((pr.includes("gf")||al.includes("grain")) && p.gf){s+=2; why.push("곡물을 뺀 그레인프리");}
    if(pr.includes("simple") && p.ltd){s+=3; why.push("동물성 단백질이 하나라 원재료표가 짧아요");}
    if(pr.includes("picky") && p.tags.includes("picky")){s+=2; why.push("향이 뚜렷해 입 짧은 아이들이 많이 찾는 레시피");}
    if(pr.includes("novel") && p.tags.includes("novel")){s+=3; why.push(`닭·소와 다른 새로운 단백질 (${p.pl})`);}
    if(pr.includes("fish") && p.prot==="fish"){s+=2; why.push("생선 단백질");}
    if(pt.active==="high" && p.tags.includes("active")){s+=3; why.push("활동량 많은 아이용");}
    if(sz==="large" && p.large){s+=3; why.push("대형견용 레시피");}
    if(sz==="small" && p.small){s+=2; why.push("소형견용 작은 알갱이");}
    if(p.hot){s+=1.5; why.push("필린에서 많이 찾는 제품");}
    return {p,s,why,caution};
  }).filter(r=>r && r.s>0).sort((a,b)=>b.s-a.s).slice(0,3);
}

function toHash(){

}
function fromHash(){
  const h=new URLSearchParams(location.hash.slice(1)); const sp=h.get("sp");
  if(!["dog","cat"].includes(sp)) return false;
  const pick=(k,list,d)=>{ const v=h.get(k); return list.some(o=>o[0]===v)?v:d; };
  const many=(k,list)=>(h.get(k)||"").split(",").filter(v=>list.some(o=>o[0]===v));
  ans={sp, stage:pick("st",AGES[sp],"adult"), size:pick("sz",SIZES,"small"), prefs:many("pr",PREFS[sp]), allergies:many("al",ALLERGENS), active:pick("ac",ACTIVE,"normal")};
  step=qs().length; return true;
}

  let h=`<div class="stack"><span class="eyebrow">세리가 묻고 올리가 추천해요</span><h1>우리 아이 밥, 같이 골라 볼까요?</h1></div><div class="chat">`;
  for(let i=0;i<list.length && i<=step;i++){
    const q=list[i];
    h += bubble("seri", esc(q.q(ans)) + (q.multi?' <span class="multi">중복 가능</span>':""));
    if(i<step){
      h += bubble("me", `${esc(answerText(q,ans[q.key]))}<button class="edit-a" type="button" data-redo="${i}">✎ 바꾸기</button>`);
    } else {
      h += chatNav();
      h += `<div class="answer">${q.opts(ans).map(([v,l])=>`<button class="chip" type="button" data-ans="${v}" aria-pressed="${q.multi?ans[q.key].includes(v):ans[q.key]===v}">${l}</button>`).join("")}</div>`;
      const last = i===list.length-1;
      if(q.multi) h += `<div class="row end"><button class="btn ghost" type="button" data-none>${q.none}</button><button class="btn primary" type="button" data-next>다음</button></div>`;
      if(last) h += `<button class="btn primary block" type="button" data-next>추천 보기</button>`;
      // 나이까지 답했으면 남은 질문은 지금 값(기본값)으로 두고 바로 결과로 갈 수 있어요
      else if(ans.sp && ans.stage) h += `<div class="row end"><button class="link" type="button" data-jump>바로 추천 보기 →</button></div>`;
    }
  }
  if(step<list.length) return h+`</div>`;
  return h + vResult();
}
function vResult(){
  const pt={sp:ans.sp, stage:ans.stage, size:ans.sp==="dog"?ans.size:"small", weight:0, prefs:ans.prefs, allergies:ans.allergies, active:ans.active};
  const recs=recommend(pt);
  const out=P.filter(p=>p.sp===ans.sp && (ans.allergies.includes(p.prot) || (ans.allergies.includes("grain") && !p.gf)));
  let h = bubble("oli", recs.length ? `올리예요! 답해 준 내용으로 맞는 사료 ${recs.length}가지를 골랐어요. 눌러서 원료와 가격을 확인해 보세요.` : `조건에 딱 맞는 사료를 못 찾았어요. 답을 하나 바꿔 볼까요?`) + `</div>`;
  h += chatNav();
  h += `<section class="stack" id="recEnd">${recs.map(recCard).join("")}</section>`;
  if(out.length) h += `<p class="note">피해야 할 재료(${ans.allergies.map(allergenName).join("·")})가 주 원료인 제품 ${out.length}가지는 추천에서 뺐어요.</p>`;
  if(recs.length) h += `<section class="cta"><h3>마음에 드는 사료를 찾았나요?</h3><p class="small">1순위 추천 <b>${esc(BRANDS[recs[0].p.b].name+" "+recs[0].p.n)}</b>, 네이버 스토어에서 바로 살 수 있어요. 다른 추천 사료도 카드를 눌러 구매 버튼을 찾을 수 있어요.</p>
      <div class="row"><a class="btn primary" href="${storeUrl(recs[0].p)}" target="_blank" rel="noopener">네이버 스토어에서 구매하기</a><button class="btn ghost" type="button" data-share>결과 링크 복사</button></div>
      <a class="link" href="./">필린 앱에서 정기배송 알아보기</a></section>`;
  h += `<p class="note">추천은 참고용이에요. 사료 전환은 7~10일에 걸쳐 천천히, 알러지나 건강 고민은 수의사 선생님과 먼저 상담해 주세요. 가격은 스마트스토어 기준(2026-10-30)이라 바뀔 수 있어요.</p>
    <button class="btn ghost block" type="button" data-restart>처음부터 다시</button>`;
  return h;
}
function chatNav(){
  const n=qs().length, done=step>=n;
  return `<div class="chatnav">
    <button class="navbtn" type="button" data-back ${step===0?"disabled":""}>← ${done?"마지막 질문으로":"이전 질문"}</button>
    <span class="prog">${done?"추천 완료":`질문 ${step+1} / ${n}`}</span>
    <button class="navbtn" type="button" data-restart ${step===0?"disabled":""}>처음부터 ↺</button>
  </div>`;
}
function render(){
  $("#view").innerHTML = step<0 ? vStart() : vChat();
  const done = step>=0 && step>=qs().length;
  history.replaceState(null,"",done?toHash():location.pathname+location.search);
}
function scrollTo(sel){ requestAnimationFrame(()=>{ const t=document.querySelector(sel); if(t) t.scrollIntoView({block:"center",behavior:"smooth"}); }); }
function advance(){ step++; render(); scrollTo("#recEnd, .chat .answer"); }

function openProduct(id){
  const p=byId[id], r=recommend({sp:ans.sp, stage:ans.stage, size:ans.sp==="dog"?ans.size:"small", prefs:ans.prefs, allergies:ans.allergies, active:ans.active}).find(x=>x.p.id===id);
  const sizes=p.sizes||[];
  $("#sheet").innerHTML = `<div class="row" style="justify-content:space-between"><span class="small muted">${BRANDS[p.b].name} · ${BRANDS[p.b].en}</span><button class="link" type="button" data-close>닫기</button></div>
    <div class="ph"><img src="${img(p.id)}" alt="${esc(BRANDS[p.b].name+" "+p.n)}"></div>
    <h2 id="sheetTitle">${esc(p.n)}</h2>
    <p class="small muted">${esc(p.pt)}</p>
    ${r&&r.caution?`<p class="caution">⚠ ${esc(r.caution)}</p>`:""}
    <div class="stack" style="gap:6px"><b class="small">용량별 가격</b>
      ${sizes.map(s=>{const pr=priceOf(p,s); return `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px"><span>${szText(s)}</span><span>${pr?`${pr[1]?`<s class="small muted">${won(pr[1])}</s> `:""}<b>${won(pr[0])}</b> <span class="small muted">· 정기배송 ${won(autoPrice(pr[0]))}</span>`:'<span class="muted small">가격 준비 중</span>'}${soldOut(p,s)?' <span class="badge">일시품절</span>':""}</span></div>`;}).join("")}
    </div>
    <dl class="spec">
      <dt>대상</dt><dd>${spName(p.sp)} · ${p.st.map(s=>stageName(s,p.sp)).join(", ")}</dd>
      <dt>주 단백질</dt><dd>${esc(p.pl)}${p.ltd?" (동물성 단백질 하나)":""}</dd>
      <dt>곡물</dt><dd>${p.gf?"그레인프리":"곡물 포함"}</dd>
      ${p.also&&Object.keys(p.also).length?`<dt>함께 든 원료</dt><dd>${Object.entries(p.also).map(([k,v])=>`${allergenName(k)} (${esc(v)})`).join(", ")}</dd>`:""}
      <dt>열량</dt><dd>${p.kcal?`${p.kcal.toLocaleString("ko-KR")} kcal/kg`:"표기 준비 중"}</dd>
    </dl>
    <a class="btn primary block" href="${storeUrl(p)}" target="_blank" rel="noopener">네이버 스토어에서 구매하기</a>
    <a class="link" href="./" style="align-self:center">필린 앱에서 정기배송 알아보기</a>`;
  $("#sheetBg").hidden=false; document.body.style.overflow="hidden"; $("#sheet").scrollTop=0;
  $("#sheet [data-close]").focus();
}
function closeSheet(){ $("#sheetBg").hidden=true; document.body.style.overflow=""; }

document.addEventListener("click", e=>{
  if(e.target===$("#sheetBg")) return closeSheet();
  const t=e.target.closest("button"); if(!t) return; const d=t.dataset;
  if("begin" in d){ step=0; render(); scrollTo(".chat .answer"); }
  else if(d.ans!==undefined){
    const q=qs()[step];
    if(q.multi){ const s=new Set(ans[q.key]); s.has(d.ans)?s.delete(d.ans):s.add(d.ans); ans[q.key]=[...s]; t.setAttribute("aria-pressed",s.has(d.ans)); }
    else {
      if(q.key==="sp" && ans.sp!==d.ans){ ans={...fresh(), sp:d.ans}; } // 강아지↔고양이를 바꾸면 나머지 답은 새로
      ans[q.key]=d.ans;
      // 마지막 질문은 눌러도 넘어가지 않고 선택만 바꿔요. '추천 보기'로 결과로 가요
      if(step===qs().length-1) document.querySelectorAll(".chat .answer .chip").forEach(c=>c.setAttribute("aria-pressed",c===t));
      else advance();
    }
  }
  else if("next" in d){ advance(); }
  else if("jump" in d){ step=qs().length; render(); scrollTo("#recEnd"); }
  else if("none" in d){ ans[qs()[step].key]=[]; advance(); }
  else if(d.redo!==undefined){ step=+d.redo; render(); scrollTo(".chat .answer"); }
  else if("back" in d){ step=Math.max(0,step-1); render(); scrollTo(".chat .answer"); }
  else if("restart" in d){ ans=fresh(); step=0; render(); window.scrollTo({top:0}); toast("처음 질문부터 다시 시작해요."); }
  else if(d.open){ openProduct(d.open); }
  else if("close" in d){ closeSheet(); }
  else if("share" in d){
    const url=location.href;
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("결과 링크를 복사했어요."),()=>{ prompt("이 링크를 복사해 주세요", url); });
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#sheetBg").hidden) closeSheet(); });

window.addEventListener("hashchange", ()=>{ if(fromHash()){ closeSheet(); render(); } });
fromHash();
render();
</script>
</body>
</html>
